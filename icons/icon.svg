<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- OpenVox Read Aloud — source icon. Regenerate PNGs with scripts/gen-icons.sh (npm run icons). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b2a6f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#sheen)"/>

  <!-- page card -->
  <g filter="url(#shadow)">
    <rect x="24" y="22" width="62" height="84" rx="10" fill="url(#card)"/>
  </g>
  <!-- text lines -->
  <rect x="34" y="36" width="42" height="7" rx="3.5" fill="#1e3a8a" opacity="0.28"/>
  <rect x="34" y="51" width="34" height="7" rx="3.5" fill="#1e3a8a" opacity="0.28"/>
  <!-- the sentence being read -->
  <rect x="31" y="64.5" width="48" height="12" rx="6" fill="#ffd60a"/>
  <rect x="34" y="67" width="42" height="7" rx="3.5" fill="#1e3a8a" opacity="0.75"/>
  <rect x="34" y="83" width="38" height="7" rx="3.5" fill="#1e3a8a" opacity="0.28"/>
  <rect x="34" y="96" width="26" height="6" rx="3" fill="#1e3a8a" opacity="0.2"/>

  <!-- speaker badge -->
  <g filter="url(#shadow)">
    <circle cx="94" cy="88" r="22" fill="url(#badge)"/>
  </g>
  <path d="M82 83 L82 93 L87 93 L94 99 L94 77 L87 83 Z" fill="#1e3a8a"/>
  <path d="M100 82 Q104 88 100 94" fill="none" stroke="#1e3a8a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M105.5 78 Q112 88 105.5 98" fill="none" stroke="#1e3a8a" stroke-width="3.2" stroke-linecap="round" opacity="0.6"/>
</svg>
